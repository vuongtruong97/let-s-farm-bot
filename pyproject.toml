[project]
name = "letsfarm-bot"
version = "0.1.0"
description = "Hay Day observe-decide-act bot for BlueStacks (farming + newspaper shop)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
letsfarm-bot = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/web/static" = "app/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
