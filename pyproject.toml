[project]
name = "letsfarm-auto"
version = "1.0.0"
description = "Auto thu hoạch và trồng Let's Farm trên BlueStacks (Windows)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Let's Farm Auto" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.10.0,<5",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
letsfarm-auto = "letsfarm_auto.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letsfarm_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
